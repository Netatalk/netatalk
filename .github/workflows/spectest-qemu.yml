name: QEMU Spec Tests

on:
  push:
    branches:
      - main
      - branch-*
  pull_request:
    branches:
      - main
      - branch-*
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  debian-s390x-tests:
    name: AFP spec test (s390x) AFP 3.4 - Debian
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Register the emulator before starting any s390x containers.
      # A job-level container would start before this step can run.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: s390x
      - name: Build and run unit tests
        run: |
          mkdir -p "$RUNNER_TEMP/s390x-reports"
          docker build --platform linux/s390x --progress=plain \
            --file distrib/docker/testsuite_deb.Dockerfile \
            --target build --tag netatalk-testsuite-build:s390x . \
            2>&1 | tee "$RUNNER_TEMP/s390x-reports/build.log"
      - name: Collect unit test reports
        run: |
          docker create --platform linux/s390x --name s390x-unit-reports \
            netatalk-testsuite-build:s390x
          docker cp s390x-unit-reports:/netatalk-code/build/meson-logs \
            "$RUNNER_TEMP/s390x-reports/meson-logs"
          docker rm s390x-unit-reports
      - name: Build testsuite runtime image
        run: |
          docker build --platform linux/s390x --progress=plain \
            --file distrib/docker/testsuite_deb.Dockerfile \
            --tag netatalk-testsuite:s390x . \
            2>&1 | tee "$RUNNER_TEMP/s390x-reports/runtime-build.log"
          test "$(docker run --rm --platform linux/s390x \
            netatalk-testsuite:s390x dpkg --print-architecture)" = s390x
      - name: Run AFP 3.4 spectest
        run: |
          docker run --rm --platform linux/s390x \
            -e AFP_USER=atalk1 -e AFP_USER2=atalk2 \
            -e AFP_PASS=ci-test1 -e AFP_PASS2=ci-test1 \
            -e AFP_GROUP=afpusers \
            -e SHARE_NAME=test1 -e SHARE_NAME2=test2 \
            -e INSECURE_AUTH=1 -e DISABLE_TIMEMACHINE=1 \
            -e TESTSUITE=spec -e AFP_VERSION=7 \
            -e AFP_EXTMAP=1 -e AFP_DIRCACHESIZE=1024 \
            -e AFP_CNID_BACKEND=sqlite \
            -v "$RUNNER_TEMP/s390x-reports:/reports" \
            -e AFP_JUNIT_REPORT_PATH=/reports/afp-spectest.junit.xml \
            netatalk-testsuite:s390x \
            2>&1 | tee "$RUNNER_TEMP/s390x-reports/spectest.log"
      - name: Summarize test results
        if: always()
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: |
            ${{ runner.temp }}/s390x-reports/meson-logs/testlog.junit.xml
            ${{ runner.temp }}/s390x-reports/afp-spectest.junit.xml
          folded: true
      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian-s390x-test-reports
          path: ${{ runner.temp }}/s390x-reports
