name: Builds (Legacy)

# Build + unit tests on legacy Linux configurations

on:
  push:
    branches:
      - main
      - branch-*
  pull_request:
    branches:
      - main
      - branch-*
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

env:
  LD_LIBRARY_PATH: /usr/local/lib
  PKG_CONFIG_PATH: /usr/local/lib/pkgconfig

jobs:
  build-ubuntu-22-04:
    name: Ubuntu Linux (22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes --no-install-recommends \
            bison \
            cmark-gfm \
            cracklib-runtime \
            dconf-cli \
            flex \
            g++ \
            gcc \
            libacl1-dev \
            libavahi-client-dev \
            libcrack2-dev \
            libcups2-dev \
            libdbus-1-dev \
            libevent-dev \
            libgcrypt20-dev \
            libglib2.0-dev \
            libiniparser-dev \
            libkrb5-dev \
            libldap2-dev \
            libmagic-dev \
            libmariadb-dev \
            libpam0g-dev \
            libsqlite3-dev \
            libtalloc-dev \
            libtirpc-dev \
            libtracker-sparql-3.0-dev \
            libwrap0-dev \
            libxapian-dev \
            ninja-build \
            pkg-config \
            python3-venv \
            quota \
            systemtap-sdt-dev \
            tcpd \
            tracker \
            tracker-miner-fs
          # Ubuntu 22.04 ships Meson 0.61.2; Netatalk requires at least 0.62.0.
          python3 -m venv "$RUNNER_TEMP/meson-venv"
          "$RUNNER_TEMP/meson-venv/bin/pip" install 'meson==0.62.0'
          echo "$RUNNER_TEMP/meson-venv/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: |
          meson setup build \
            -Dbuildtype=debugoptimized \
            -Dwith-appletalk=true \
            -Dwith-dtrace=false \
            -Dwith-init-hooks=false \
            -Dwith-tests=true \
            -Dwith-testsuite=true
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build
      - name: Summarize test results
        if: always()
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: build/meson-logs/testlog.junit.xml
          folded: true
      - name: Install
        run: sudo "$RUNNER_TEMP/meson-venv/bin/meson" install -C build
      - name: Check netatalk capabilities
        run: |
          netatalk -V
          afpd -V
          atalkd -V
          a2boot -V
          macipgw -V
          papd -V
          timelord -V
      - name: Upload meson logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meson-logs-${{ github.job }}
          path: build/meson-logs

  build-ubuntu-32bit:
    name: Ubuntu Linux (32-bit)
    # Docker 29.4.2 on the 26.04 runner blocks i386 socketcall (moby/moby#52506).
    # Keep the 26.04 userspace below, but use the 24.04 host until Docker is fixed.
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    container:
      image: ubuntu:26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install 32-bit toolchain and dependencies
        run: |
          dpkg --add-architecture i386
          apt-get update
          apt-get install --assume-yes --no-install-recommends \
            ca-certificates \
            cmark-gfm \
            cracklib-runtime \
            dconf-cli \
            file \
            g++-multilib \
            gcc-multilib \
            libacl1-dev:i386 \
            libavahi-client-dev:i386 \
            libcrack2-dev:i386 \
            libcups2-dev:i386 \
            libdbus-1-dev:i386 \
            libevent-dev:i386 \
            libgcrypt20-dev:i386 \
            libiniparser-dev:i386 \
            libkrb5-dev:i386 \
            libldap2-dev:i386 \
            libmagic-dev:i386 \
            libpam0g-dev:i386 \
            libtalloc-dev:i386 \
            libtirpc-dev:i386 \
            libwrap0-dev:i386 \
            libsqlite3-dev:i386 \
            libxapian-dev:i386 \
            meson \
            ninja-build \
            pkg-config \
            quota \
            systemtap-sdt-dev \
            tcpd
      - name: Configure (32-bit)
        env:
          CFLAGS: -m32
          CXXFLAGS: -m32
          LDFLAGS: -m32
          PKG_CONFIG_LIBDIR: /usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
        run: |
          meson setup build \
            -Dbuildtype=debugoptimized \
            -Dwith-appletalk=true \
            -Dwith-dtrace=false \
            -Dwith-init-hooks=false \
            -Dwith-tests=true \
            -Dwith-testsuite=true
      - name: Build
        run: meson compile -C build
      - name: Verify 32-bit binary
        run: file build/etc/afpd/afpd | grep -q 'ELF 32-bit'
      - name: Test
        run: meson test -C build
      - name: Summarize test results
        if: always()
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: build/meson-logs/testlog.junit.xml
          folded: true
      - name: Install
        run: meson install -C build
      - name: Check netatalk capabilities
        run: |
          netatalk -V
          afpd -V
          atalkd -V
          a2boot -V
          macipgw -V
          papd -V
          timelord -V
      - name: Upload meson logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meson-logs-${{ github.job }}
          path: build/meson-logs
