name: Containers

on:
  push:
    branches:
      - main
      - branch-*
  pull_request:
    branches:
      - main
      - branch-*
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  REPO: ${{ github.repository }}
  CONT_PASSWD: ${{ secrets.AFP_PASSWD }}
  DB_PASSWD: ${{ secrets.MARIADB_ROOT_PASSWORD }}

jobs:
  build-container:
    name: Build production container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !github.event.pull_request.head.repo.fork }}
    permissions:
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create image name
        run: |
          echo "IMAGE_NAME=${REPO,,}" >> ${GITHUB_ENV}
      - name: Login to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=${{ github.sha }}
      - name: Build and push container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: distrib/docker/netatalk.Dockerfile
          push: true
          labels: ${{ steps.metadata.outputs.labels }}
          tags: ${{ steps.metadata.outputs.tags }}

  build-container-testsuite:
    name: Build Alpine testsuite container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !github.event.pull_request.head.repo.fork }}
    permissions:
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create image name
        run: |
          echo "IMAGE_NAME=${REPO,,}-testsuite" >> ${GITHUB_ENV}
      - name: Login to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=${{ github.sha }}
      - name: Build and push container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: distrib/docker/testsuite_alp.Dockerfile
          push: true
          labels: ${{ steps.metadata.outputs.labels }}
          tags: ${{ steps.metadata.outputs.tags }}

  build-container-webmin:
    name: Build Netatalk Webmin Module container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !github.event.pull_request.head.repo.fork }}
    permissions:
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create image name
        run: |
          echo "IMAGE_NAME=${REPO,,}-webmin" >> ${GITHUB_ENV}
      - name: Login to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=${{ github.sha }}
      - name: Build and push container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: distrib/docker/webmin_module.Dockerfile
          push: true
          labels: ${{ steps.metadata.outputs.labels }}
          tags: ${{ steps.metadata.outputs.tags }}

  build-container-testsuite-debian:
    name: Build Debian testsuite container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !github.event.pull_request.head.repo.fork }}
    permissions:
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create image name
        run: |
          echo "IMAGE_NAME=${REPO,,}-testsuite-debian" >> ${GITHUB_ENV}
      - name: Login to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=${{ github.sha }}
      - name: Build and push container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: distrib/docker/testsuite_deb.Dockerfile
          push: true
          labels: ${{ steps.metadata.outputs.labels }}
          tags: ${{ steps.metadata.outputs.tags }}

  build-container-tsan:
    name: Build TSAN testsuite container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ !github.event.pull_request.head.repo.fork }}
    permissions:
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create image name
        run: |
          echo "IMAGE_NAME=${REPO,,}-testsuite-tsan" >> ${GITHUB_ENV}
      - name: Login to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=${{ github.sha }}
      - name: Build and push container image
        id: build-and-push
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: distrib/docker/testsuite_deb.Dockerfile
          push: true
          build-args: |
            EXTRA_MESON_ARGS=-Db_sanitize=thread
            EXTRA_RUN_DEPS=libtsan2
          labels: ${{ steps.metadata.outputs.labels }}
          tags: ${{ steps.metadata.outputs.tags }}
      - name: Wait before retrying container image push
        if: ${{ steps.build-and-push.outcome == 'failure' }}
        run: sleep 10
      - name: Retry container image push
        if: ${{ steps.build-and-push.outcome == 'failure' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: distrib/docker/testsuite_deb.Dockerfile
          push: true
          build-args: |
            EXTRA_MESON_ARGS=-Db_sanitize=thread
            EXTRA_RUN_DEPS=libtsan2
          labels: ${{ steps.metadata.outputs.labels }}
          tags: ${{ steps.metadata.outputs.tags }}

  tsan-spectest:
    name: Spectest + lantest under ThreadSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-container-tsan
    if: ${{ !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' }}
    permissions:
      contents: read
      checks: write
    steps:
      - name: Lower ASLR entropy for TSAN shadow-memory compatibility
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Create image name
        run: |
          echo "IMAGE_NAME=${REPO,,}-testsuite-tsan" >> ${GITHUB_ENV}
      - name: Run spectest under TSAN
        run: |
          docker run --privileged --rm \
              -e AFP_USER=atalk1 -e AFP_USER2=atalk2 \
              -e AFP_PASS="$CONT_PASSWD" -e AFP_PASS2="$CONT_PASSWD" \
              -e AFP_GROUP=afpusers \
              -e SHARE_NAME=test1 -e SHARE_NAME2=test2 \
              -e INSECURE_AUTH=1 -e DISABLE_TIMEMACHINE=1 \
              -e TESTSUITE=spec -e AFP_VERSION=7 \
              -v "$RUNNER_TEMP:/reports" \
              -e AFP_JUNIT_REPORT_PATH=/reports/afp-spectest.junit.xml \
              -e AFP_CNID_BACKEND=sqlite \
              -e TSAN_OPTIONS="halt_on_error=1 abort_on_error=1" \
              ${{ env.REGISTRY }}/${IMAGE_NAME}:${{ github.sha }}
      - name: Run lantest under TSAN
        run: |
          docker run --privileged --rm \
              -e AFP_USER=atalk1 -e AFP_PASS="$CONT_PASSWD" \
              -e AFP_GROUP=afpusers -e SHARE_NAME=test1 \
              -e INSECURE_AUTH=1 -e DISABLE_TIMEMACHINE=1 \
              -e TESTSUITE=lan -e AFP_VERSION=7 \
              -e AFP_TEST_ITERATIONS=2 \
              -e AFP_CNID_BACKEND=sqlite \
              -e TSAN_OPTIONS="halt_on_error=1 abort_on_error=1" \
              ${{ env.REGISTRY }}/${IMAGE_NAME}:${{ github.sha }}

      - name: Checkout repository for test report
        if: ${{ !cancelled() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish AFP spec test results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: AFP Spectest (${{ github.job }})
          path: ${{ runner.temp }}/afp-spectest.junit.xml
          reporter: java-junit

  build-container-debug:
    name: Build debug profiling container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
    permissions:
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create image name
        run: |
          echo "IMAGE_NAME=${REPO,,}-debug" >> ${GITHUB_ENV}
      - name: Login to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=${{ github.sha }}
      - name: Build and push container image
        id: build-and-push
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: distrib/docker/debug_alp.Dockerfile
          push: true
          labels: ${{ steps.metadata.outputs.labels }}
          tags: ${{ steps.metadata.outputs.tags }}
      - name: Wait before retrying container image push
        if: ${{ steps.build-and-push.outcome == 'failure' }}
        run: sleep 10
      - name: Retry container image push
        if: ${{ steps.build-and-push.outcome == 'failure' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: distrib/docker/debug_alp.Dockerfile
          push: true
          labels: ${{ steps.metadata.outputs.labels }}
          tags: ${{ steps.metadata.outputs.tags }}

  flamegraph-spectest:
    name: Spectest (AFP 3.4) - FlameGraph
    needs: build-container-debug
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
    permissions:
      contents: write
      checks: write
    outputs:
      self_time: ${{ steps.flamegraph-summary.outputs.SELF_TIME }}
      self_time_warning: ${{ steps.flamegraph-summary.outputs.SELF_TIME_WARNING }}
      runtime: ${{ steps.flamegraph-summary.outputs.TEST_RUNTIME }}
      stacks: ${{ steps.flamegraph-summary.outputs.STACK_COUNT }}
      svg_size: ${{ steps.flamegraph-summary.outputs.SVG_SIZE }}
      top_funcs: ${{ steps.flamegraph-summary.outputs.TOP_FUNCS }}
    steps:
      # Checkout is needed to resolve the local publish-gh-pages action
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run spectest with flamegraph profiling
        run: |
          docker run --privileged --rm \
              -e AFP_USER=atalk1 \
              -e AFP_USER2=atalk2 \
              -e AFP_PASS="$CONT_PASSWD" \
              -e AFP_PASS2="$CONT_PASSWD" \
              -e AFP_GROUP=afpusers \
              -e SHARE_NAME=test1 \
              -e SHARE_NAME2=test2 \
              -e INSECURE_AUTH=1 \
              -e DISABLE_TIMEMACHINE=1 \
              -e AFP_EXTMAP=1 \
              -e AFP_DIRCACHESIZE=1024 \
              -e AFP_DIRCACHE_MODE=arc \
              -e AFP_DIRCACHE_VALIDATION_FREQ=100 \
              -e AFP_DIRCACHE_RFORK_BUDGET=102400 \
              -e AFP_DIRCACHE_RFORK_MAXSIZE=1024 \
              -e AFP_CNID_BACKEND=sqlite \
              -e AFP_CNID_TMPFS=1 \
              -e TESTSUITE=spec \
            -v "$RUNNER_TEMP:/reports" \
            -e AFP_JUNIT_REPORT_PATH=/reports/afp-spectest.junit.xml \
              -e AFP_VERSION=7 \
              -e FLAMEGRAPH=1 \
              ${{ env.REGISTRY }}/netatalk/netatalk-debug:${{ github.sha }} \
              > flamegraph.svg 2>flamegraph.log
      - name: Show profiling log
        if: always()
        run: cat flamegraph.log
      - name: Validate SVG and extract summary
        id: flamegraph-summary
        run: |
          if [ ! -s flamegraph.svg ]; then
            echo "ERROR: flamegraph.svg is empty or missing" >&2
            exit 1
          fi
          SVG_SIZE=$(du -h flamegraph.svg | cut -f1)
          echo "Flamegraph SVG size: $SVG_SIZE"
          echo "SVG line count: $(wc -l < flamegraph.svg)"
          # Extract unique stack count from the log
          STACK_COUNT=$(grep -o 'Folded stacks: [0-9]*' flamegraph.log | grep -o '[0-9]*' || echo "unknown")
          echo "Unique stacks: $STACK_COUNT"
          # Extract test runtime from structured log
          TEST_RUNTIME=$(grep -o 'FLAMEGRAPH_RUNTIME: [0-9]*s' flamegraph.log | grep -o '[0-9]*' || echo "unknown")
          echo "Test runtime: ${TEST_RUNTIME}s"
          # Extract Netatalk self-time percentage from structured log
          SELF_TIME=$(grep -o 'FLAMEGRAPH_SELF_TIME: [0-9.]*%' flamegraph.log | grep -o '[0-9.]*%' || echo "unknown")
          echo "Netatalk self-time: $SELF_TIME"
          # Flag if Netatalk code-time exceeds the regression threshold (7.5%).
          # A breach means more CPU is being spent in Netatalk code than expected.
          SELF_TIME_THRESHOLD=7.5
          SELF_TIME_NUM=$(echo "$SELF_TIME" | grep -o '[0-9.]*' || echo "")
          SELF_TIME_WARNING=""
          if [ -n "$SELF_TIME_NUM" ] && awk "BEGIN { exit !($SELF_TIME_NUM > $SELF_TIME_THRESHOLD) }"; then
            SELF_TIME_WARNING="⚠️ **WARNING: Netatalk Code-time ${SELF_TIME} exceeds the ${SELF_TIME_THRESHOLD}% threshold — possible performance regression!**"
            echo "$SELF_TIME_WARNING"
          fi
          # Extract top 10 leaf functions (self-time) from the entrypoint's
          # structured output in the log. Format: "FLAMEGRAPH_LEAF: <count> <func>"
          TOP_FUNCS=$(grep 'FLAMEGRAPH_LEAF:' flamegraph.log \
            | sed 's/.*FLAMEGRAPH_LEAF: //' \
            | head -10 \
            | awk '{cnt=$1; $1=""; sub(/^ /, "", $0); printf "| `%s` | %s |\n", $0, cnt}' \
            || echo "| (unable to extract) | - |")
          # Save to env for the comment step
          {
            echo "SVG_SIZE=$SVG_SIZE"
            echo "STACK_COUNT=$STACK_COUNT"
            echo "TEST_RUNTIME=${TEST_RUNTIME}s"
            echo "SELF_TIME=$SELF_TIME"
            echo "SELF_TIME_WARNING=$SELF_TIME_WARNING"
            echo "TOP_FUNCS<<EOFTOP"
            echo "$TOP_FUNCS"
            echo "EOFTOP"
          } >> "$GITHUB_OUTPUT"
      - name: Convert SVG to PNG for PR comment preview
        run: |
          sudo apt-get install -y -qq librsvg2-bin > /dev/null
          rsvg-convert -w 1200 flamegraph.svg -o flamegraph.png
          echo "PNG size: $(du -h flamegraph.png | cut -f1)"
      - name: Upload flamegraph artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flamegraph-spectest
          path: |
            flamegraph.svg
            flamegraph.png
          retention-days: 30
      - name: Publish flamegraph to gh-pages branch
        uses: ./.github/actions/publish-gh-pages
        with:
          files: flamegraph.svg flamegraph.png
          dest-dir: spectest
          commit-prefix: flamegraph
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout repository for test report
        if: ${{ !cancelled() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish AFP spec test results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: AFP Spectest (${{ github.job }})
          path: ${{ runner.temp }}/afp-spectest.junit.xml
          reporter: java-junit

  afp-spectest-dbd-afp34-prod:
    name: AFP spec test (cnid:dbd) AFP 3.4 - Alpine (Client/Server, PerfConfig)
    needs:
      - build-container
      - build-container-testsuite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.actor != 'dependabot[bot]' }}
    permissions:
      contents: read
      checks: write
    steps:
      - name: Create Docker network
        run: |
          docker network create afp_network
      - name: Run Netatalk
        run: |
          docker run --detach \
              --name afp_server \
              --network afp_network \
              -e AFP_USER=atalk1 \
              -e AFP_USER2=atalk2 \
              -e AFP_PASS="$CONT_PASSWD" \
              -e AFP_PASS2="$CONT_PASSWD" \
              -e AFP_GROUP=afpusers \
              -e SHARE_NAME=test1 \
              -e SHARE_NAME2=test2 \
              -e INSECURE_AUTH=1 \
              -e DISABLE_TIMEMACHINE=1 \
              -e AFP_EXTMAP=1 \
              -e AFP_DIRCACHESIZE=1048576 \
              -e AFP_DIRCACHE_VALIDATION_FREQ=100 \
              -e AFP_DIRCACHE_MODE=arc \
              -e AFP_DIRCACHE_RFORK_BUDGET=1048576 \
              -e AFP_DIRCACHE_RFORK_MAXSIZE=1024 \
              -e AFP_CONVERT_APPLEDOUBLE=no \
              -e AFP_CNID_BACKEND=dbd \
              ${{ env.REGISTRY }}/netatalk/netatalk:${{ github.sha }}
      - name: Run Netatalk testsuite
        run: |
          docker run --rm \
              --network afp_network \
              -e AFP_USER=atalk1 \
              -e AFP_USER2=atalk2 \
              -e AFP_PASS="$CONT_PASSWD" \
              -e AFP_PASS2="$CONT_PASSWD" \
              -e AFP_GROUP=afpusers \
              -e SHARE_NAME=test1 \
              -e SHARE_NAME2=test2 \
              -e TESTSUITE=spec \
            -v "$RUNNER_TEMP:/reports" \
            -e AFP_JUNIT_REPORT_PATH=/reports/afp-spectest.junit.xml \
              -e VERBOSE=1 \
              -e AFP_VERSION=7 \
              -e AFP_REMOTE=1 \
              -e AFP_HOST=afp_server \
              ${{ env.REGISTRY }}/netatalk/netatalk-testsuite:${{ github.sha }}

      - name: Checkout repository for test report
        if: ${{ !cancelled() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish AFP spec test results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: AFP Spectest (${{ github.job }})
          path: ${{ runner.temp }}/afp-spectest.junit.xml
          reporter: java-junit

  afp-spectest-mysql-afp34-prod:
    name: AFP spec test (cnid:mysql) AFP 3.4 - Alpine (Client/Server/Database, PerfConfig)
    needs:
      - build-container
      - build-container-testsuite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.actor != 'dependabot[bot]' }}
    permissions:
      contents: read
      checks: write
    steps:
      - name: Create container network
        run: |
          docker network create afp_network
      - name: Start MariaDB
        run: |
          docker run --detach --name mariadb --network afp_network \
              -e MARIADB_ROOT_PASSWORD="$DB_PASSWD" \
              mariadb:latest
      - name: Wait for MariaDB to initialize
        run: |
          sleep 4
      - name: Start Netatalk
        run: |
          docker run --detach \
              --name afp_server \
              --network afp_network \
              -e AFP_USER=atalk1 \
              -e AFP_USER2=atalk2 \
              -e AFP_PASS="$CONT_PASSWD" \
              -e AFP_PASS2="$CONT_PASSWD" \
              -e AFP_GROUP=afpusers \
              -e AFP_CNID_BACKEND=mysql \
              -e SHARE_NAME=test1 \
              -e SHARE_NAME2=test2 \
              -e INSECURE_AUTH=1 \
              -e DISABLE_TIMEMACHINE=1 \
              -e AFP_EXTMAP=1 \
              -e AFP_CNID_SQL_HOST=mariadb \
              -e AFP_CNID_SQL_USER=root \
              -e AFP_CNID_SQL_PASS="$DB_PASSWD" \
              -e AFP_DIRCACHESIZE=1048576 \
              -e AFP_DIRCACHE_VALIDATION_FREQ=100 \
              -e AFP_DIRCACHE_MODE=arc \
              -e AFP_DIRCACHE_RFORK_BUDGET=1048576 \
              -e AFP_DIRCACHE_RFORK_MAXSIZE=1024 \
              -e AFP_CONVERT_APPLEDOUBLE=no \
              ${{ env.REGISTRY }}/netatalk/netatalk:${{ github.sha }}
      - name: Run Netatalk testsuite
        run: |
          docker run --rm \
              --network afp_network \
              -e AFP_USER=atalk1 \
              -e AFP_USER2=atalk2 \
              -e AFP_PASS="$CONT_PASSWD" \
              -e AFP_PASS2="$CONT_PASSWD" \
              -e AFP_GROUP=afpusers \
              -e SHARE_NAME=test1 \
              -e SHARE_NAME2=test2 \
              -e TESTSUITE=spec \
            -v "$RUNNER_TEMP:/reports" \
            -e AFP_JUNIT_REPORT_PATH=/reports/afp-spectest.junit.xml \
              -e VERBOSE=1 \
              -e AFP_VERSION=7 \
              -e AFP_REMOTE=1 \
