name: Walk timing (scratch)

# Walk timing experiment (scratch branch walk-timing, never merged): times
# the ways afpd can enter a directory without following symlinks on FreeBSD
# ZFS (default, case-insensitive and formD datasets) and UFS, with a
# standalone benchmark and with afpd's own calls under the spectest.

on:
  push:
    branches:
      - walk-timing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  walk-timing-freebsd:
    name: Walk timing - FreeBSD (ZFS, UFS)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and time on VM
        uses: vmactions/freebsd-vm@4469451fe39bee80be4066836c5170362e9349f3 # v1.5.7
        with:
          copyback: true
          sync: sshfs
          prepare: |
            set -e
            pkg install -y \
              avahi \
              bison \
              cmark \
              curl \
              dconf \
              flex \
              git \
              gmake \
              iniparser \
              libev \
              file \
              libgcrypt \
              libsunacl \
              localsearch \
              meson \
              mysql97-client \
              openldap26-client \
              perl5 \
              pkgconf \
              sqlite3 \
              talloc \
              xapian-core
          run: |
            set -e
            export LD_LIBRARY_PATH=/usr/local/lib
            export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/libdata/pkgconfig
            meson setup build \
              -Dbuildtype=debugoptimized \
              -Dpkg_config_path=/usr/local/libdata/pkgconfig \
              -Dwith-eventloop=libev \
              -Dwith-tests=true \
              -Dwith-testsuite=true
            meson compile -C build
            meson install -C build --no-rebuild
            sh ./.github/scripts/walk_timing.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: walk-results
          path: walk-results
