name: Tests

on:
  push:
    branches:
      - main
      - branch-*
  pull_request:
    branches:
      - main
      - branch-*
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  formatting:
    name: Code Formatting
    runs-on: ubuntu-26.04
    container:
      image: alpine:3.24.1
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache \
            build-base \
            ca-certificates \
            cmake \
            curl \
            git \
            muon \
            nodejs \
            npm \
            perl-tidy \
            shfmt \
            yamlfmt
          curl --proto '=https' --location --fail -o /tmp/markdownlint-cli2.tgz \
            https://registry.npmjs.org/markdownlint-cli2/-/markdownlint-cli2-0.22.0.tgz
          echo '98e0bd058fd71ad757dccf67dc080445defd174f92ef0d7cc81053348438e77b08f3b7ad65fa75cf879a8ea48c57bd026236f129ee64b4abd3d870a9bdc5b1f7  /tmp/markdownlint-cli2.tgz' \
            | sha512sum -c -
          npm install --global --ignore-scripts /tmp/markdownlint-cli2.tgz
      - name: Build astyle from source
        run: |
          curl --proto '=https' --location --fail -o /tmp/astyle.tar.gz \
            https://gitlab.com/saalen/astyle/-/archive/3.6.19/astyle-3.6.19.tar.gz
          echo '7bb1fa11ce24fb94db139bb49e73fd05604b28cd7fb75c0dcbf6661e52d3e43e  /tmp/astyle.tar.gz' \
            | sha256sum -c -
          mkdir -p /tmp/astyle
          tar -xzf /tmp/astyle.tar.gz -C /tmp/astyle --strip-components=1
          cmake -S /tmp/astyle -B /tmp/astyle/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/astyle/build -j"$(nproc)"
          cmake --install /tmp/astyle/build
          astyle --version
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check formatting
        run: ./contrib/scripts/codefmt.sh -v

  markdown-linting:
    name: Markdown Linting
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.md'

  distribution-tests:
    name: Distribution Tests
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes --no-install-recommends \
            libevent-dev \
            libgcrypt20-dev \
            libiniparser-dev \
            libsqlite3-dev \
            meson \
            ninja-build
      - name: Configure
        run: |
          meson setup build \
            -Dbuildtype=debugoptimized \
            -Dwith-init-hooks=false \
            -Dwith-tests=true
      - name: Run distribution tests
        run: meson dist -C build

  build-doxygen-docs:
    name: Build Doxygen Docs
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes --no-install-recommends \
            ca-certificates \
            curl \
            meson \
            ninja-build
      - name: Install Doxygen
        run: |
          curl --proto '=https' --location --fail -o /tmp/doxygen.tar.gz \
            https://www.doxygen.nl/files/doxygen-1.18.0.linux.bin.tar.gz
          echo '14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90  /tmp/doxygen.tar.gz' \
            | sha256sum -c -
          mkdir -p /tmp/doxygen
          tar -xzf /tmp/doxygen.tar.gz -C /tmp/doxygen --strip-components=2 \
            doxygen-1.18.0/bin/doxygen
          sudo install /tmp/doxygen/doxygen /usr/local/bin/doxygen
          doxygen_version=$(doxygen --version)
          echo "$doxygen_version"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: |
          meson setup build \
            -Dbuildtype=release \
            -Dwith-docs=developer \
            -Dwith-docs-only=true \
            -Dwith-doxygen-strict=true
      - name: Upload Doxygen docs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doxygen-docs
          path: build/doc/developer
          if-no-files-found: error
      - name: Upload Meson log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meson-log
          path: build/meson-logs/meson-log.txt
