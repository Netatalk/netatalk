        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          dnf --setopt=install_weak_deps=False --assumeyes install \
            avahi-devel \
            bison \
            cargo \
            chkconfig \
            cracklib-devel \
            curl \
            cups-devel \
            dbus-devel \
            dconf \
            flex \
            gcc-c++ \
            glib2-devel \
            iniparser-devel \
            krb5-devel \
            libacl-devel \
            libev-devel \
            file-devel \
            libgcrypt-devel \
            libtalloc-devel \
            localsearch \
            make \
            mariadb-connector-c-devel \
            meson \
            ninja-build \
            openldap-devel \
            pam-devel \
            pandoc \
            perl \
            quota-devel \
            sqlite-devel \
            rust \
            systemd \
            systemtap-sdt-devel \
            tinysparql-devel \
            valgrind \
            xapian-core-devel
      - name: Install stuffit-ffi
        run: |
          curl --proto '=https' --location --fail -o /tmp/stuffit-rs.tar.gz "$STUFFIT_RS_TARBALL_URL"
          mkdir -p /tmp/stuffit-rs
          tar -xzf /tmp/stuffit-rs.tar.gz -C /tmp/stuffit-rs --strip-components=1
          cd /tmp/stuffit-rs
          cargo build --release --locked -p stuffit-ffi
