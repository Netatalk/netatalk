            -Dwith-cups-pap-backend=true \
            -Dwith-eventloop=libev \
            -Dwith-init-hooks=false \
            -Dwith-stuffit=true \
            -Dwith-tests=true \
            -Dwith-testsuite=true
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build
      - name: Summarize test results
        if: always()
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: build/meson-logs/testlog.junit.xml
          folded: true
      - name: Install
        run: meson install -C build
      - name: Check netatalk capabilities
        run: |
          netatalk -V
          afpd -V
          atalkd -V
          a2boot -V
          macipgw -V
          papd -V
          timelord -V
      - name: Upload meson logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meson-logs-${{ github.job }}
          path: build/meson-logs

  build-debian:
    name: Debian Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    timeout-minutes: 24
    container:
      image: debian:13.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install --assume-yes --no-install-recommends \
            bison \
            cargo \
            ca-certificates \
            cmark-gfm \
            cracklib-runtime \
            curl \
            dconf-cli \
            file \
            flex \
            g++ \
            gcc \
            libacl1-dev \
            libavahi-client-dev \
            libcrack2-dev \
            libcrypt-dev \
            libcups2-dev \
            libdbus-1-dev \
            libev-dev \
            libgcrypt20-dev \
            libglib2.0-dev \
            libiniparser-dev \
            libkrb5-dev \
            libldap2-dev \
            libmagic-dev \
            libmariadb-dev \
            libpam0g-dev \
            libsqlite3-dev \
            libtalloc-dev \
            libtirpc-dev \
            libtracker-sparql-3.0-dev \
            libwrap0-dev \
            libxapian-dev \
            make \
            meson \
            ninja-build \
            quota \
            systemtap-sdt-dev \
            tcpd \
            tracker \
            tracker-miner-fs \
            valgrind
      - name: Install stuffit-ffi
        run: |
          curl --proto '=https' --location --fail -o /tmp/stuffit-rs.tar.gz "$STUFFIT_RS_TARBALL_URL"
          mkdir -p /tmp/stuffit-rs
          tar -xzf /tmp/stuffit-rs.tar.gz -C /tmp/stuffit-rs --strip-components=1
          cd /tmp/stuffit-rs
          cargo build --release --locked -p stuffit-ffi
          make -C stuffit-ffi install-files PREFIX=/usr/local
      - name: Configure
        run: |
          meson setup build \
            -Dbuildtype=debugoptimized \
            -Dwith-appletalk=true \
            -Dwith-cups-pap-backend=true \
            -Dwith-eventloop=libev \
            -Dwith-init-hooks=false \
            -Dwith-init-style=debian-sysv,systemd \
            -Dwith-pkgconfdir-path=/etc/netatalk \
            -Dwith-stuffit=true \
            -Dwith-tests=true \
            -Dwith-testsuite=true
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build
      - name: Summarize test results
        if: always()
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: build/meson-logs/testlog.junit.xml
          folded: true
      - name: Run memory profiling
        run: meson test --no-suite perl --wrapper='valgrind --leak-check=full --error-exitcode=1' -C build
      - name: Install
        run: meson install -C build
      - name: Check netatalk capabilities
        run: |
          netatalk -V
          afpd -V
          atalkd -V
          a2boot -V
          macipgw -V
          papd -V
          timelord -V
      - name: Upload meson logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meson-logs-${{ github.job }}-${{ matrix.arch }}
          path: build/meson-logs

  build-fedora:
    name: Fedora Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    timeout-minutes: 24
    container:
      image: fedora:43
    steps:
