name: Builds

# Build + unit tests on Linux

on:
  push:
    branches:
      - main
      - branch-*
  pull_request:
    branches:
      - main
      - branch-*
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

env:
  STUFFIT_RS_TARBALL_URL: https://github.com/benletchford/stuffit-rs/archive/refs/tags/v0.2.1.tar.gz
  LD_LIBRARY_PATH: /usr/local/lib
  PKG_CONFIG_PATH: /usr/local/lib/pkgconfig

jobs:
  build-alpine:
    name: Alpine Linux
    runs-on: ubuntu-26.04
    timeout-minutes: 24
    container:
      image: alpine:3.23.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          apk add \
            acl-dev \
            avahi-compat-libdns_sd \
            avahi-dev \
            bison \
            build-base \
            ca-certificates \
            cargo \
            cracklib \
            cracklib-dev \
            cracklib-words \
            cups \
            cups-dev \
            curl \
            dbus-dev \
            dconf \
            flex \
            file-dev \
            gcc \
            glib \
            iniparser-dev \
            krb5-dev \
            libev-dev \
            libgcrypt-dev \
            libtirpc-dev \
            libtracker \
            linux-pam-dev \
            localsearch \
            mariadb-dev \
            meson \
            ninja \
            openldap-dev \
            openrc \
            pandoc \
            perl \
            pkgconfig \
            rpcsvc-proto-dev \
            rust \
            sqlite-dev \
            talloc-dev \
            tinysparql-dev \
            valgrind \
            xapian-core-dev
      - name: Install stuffit-ffi
        run: |
          curl --proto '=https' --location --fail -o /tmp/stuffit-rs.tar.gz "$STUFFIT_RS_TARBALL_URL"
          mkdir -p /tmp/stuffit-rs
          tar -xzf /tmp/stuffit-rs.tar.gz -C /tmp/stuffit-rs --strip-components=1
          cd /tmp/stuffit-rs
          cargo build --release --locked -p stuffit-ffi
          make -C stuffit-ffi install-files PREFIX=/usr/local
      - name: Configure
        run: |
          meson setup build \
            -Dbuildtype=debugoptimized \
            -Dwith-appletalk=true \
            -Dwith-cups-pap-backend=true \
            -Dwith-eventloop=libev \
            -Dwith-statedir-path=/var/lib \
            -Dwith-stuffit=true \
            -Dwith-tests=true \
            -Dwith-testsuite=true
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build
      - name: Summarize test results
        if: always()
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: build/meson-logs/testlog.junit.xml
          folded: true
      - name: Run memory profiling
        run: meson test --no-suite perl --wrapper='valgrind --leak-check=full --error-exitcode=1' -C build
      - name: Install
        run: meson install -C build
      - name: Check netatalk capabilities
        run: |
          netatalk -V
          afpd -V
          atalkd -V
          a2boot -V
          macipgw -V
          papd -V
          timelord -V
      - name: Upload meson logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meson-logs-${{ github.job }}
          path: build/meson-logs

