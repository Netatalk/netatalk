    name: Arch Linux
    runs-on: ubuntu-26.04
    timeout-minutes: 24
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm \
            avahi \
            bison \
            cmark-gfm \
            cracklib \
            cups \
            curl \
            dconf \
            flex \
            file \
            gcc \
            iniparser \
            libev \
            localsearch \
            mariadb-clients \
            meson \
            ninja \
            perl \
            pkgconfig \
            rpcsvc-proto \
            rust \
            sqlite \
            talloc \
            tinysparql \
            xapian-core
      - name: Install stuffit-ffi
        run: |
          curl --proto '=https' --location --fail -o /tmp/stuffit-rs.tar.gz "$STUFFIT_RS_TARBALL_URL"
          mkdir -p /tmp/stuffit-rs
          tar -xzf /tmp/stuffit-rs.tar.gz -C /tmp/stuffit-rs --strip-components=1
          cd /tmp/stuffit-rs
          cargo build --release --locked -p stuffit-ffi
